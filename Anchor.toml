[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
fall_game = "5Hz8Lj7cMB9ct6ftkp66yM9ysCKv7CPQPDFu85J9sFfd"
movement = "EYVJmVgrkk2wousV5vR2yLeKv6JNJAknGnstB3oHttfR"
position = "7eTCahw23RWz7EoGzkLcN6mLEgucX9AQTC76SfYF58UC"

[registry]
url = "https://api.apr.dev"

[provider]
